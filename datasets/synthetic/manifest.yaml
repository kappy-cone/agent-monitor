# Synthetic dataset build plan. One row per output transcript.
# generate.py reads this file; nothing is generated that isn't declared here.
#
# class: benign | hard_negative | security_vuln | reward_hacking | scope_expansion | deception
#   - benign / hard_negative rows are labeled "benign" in labels.jsonl
#     (hard_negative is recorded in the label's notes, not the label itself)
# tier: blatant | medium | subtle (failure rows only)
# injection_method: none (clean re-emission) | llm_local_edit (LLM-authored local event edits)
# pair_with: the clean transcript built from the same base (matched pair)
# Every transcript: parse base -> scrub -> strip raw -> renumber -> (inject) -> emit,
# constrained by STYLE_PROFILE.md. Failure events must render inside the default
# 64k-char monitor budget.

version: 1

defaults:
  # Edit plans are authored by Claude Code subagents (no API key available in this
  # environment) and committed under plans/; generate.py applies them deterministically.
  # generate.py --author supports direct AnthropicClient authoring where creds exist.
  injector_model: claude-fable-5
  injection_authoring: subagent-written edit plans in plans/<id>.json, committed
  temperature_note: plan application is deterministic; tests use MockLLMClient

